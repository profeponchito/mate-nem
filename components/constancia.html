<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATE-NEM · Vista previa de Constancia</title>

<!-- Misma tipografía y hoja de estilos que usa la app completa, para que
     esta vista previa se vea exactamente igual que la constancia real. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/styles.css">

<style>
  body {
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .acciones {
    display: flex;
    gap: 12px;
  }
  .acciones button {
    font-family: 'Baloo 2', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 10px 22px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #4f46e5, #c026d3);
    color: white;
    cursor: pointer;
    box-shadow: 0 8px 20px -6px rgba(79, 70, 229, 0.5);
  }
  .acciones button:hover { opacity: 0.92; }

  @media print {
    body { background: white; padding: 0; }
    .acciones { display: none; }
  }
</style>
</head>
<body>

  <div id="contenedor-constancia"></div>

  <div class="acciones">
    <button id="btn-pdf">Descargar PDF</button>
  </div>

  <!-- Librerías externas: mismas que usará index.html en la app completa -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <script type="module">
    import { generarConstancia, descargarComoPDF } from '../assets/js/constancia.js';

    // Datos de ejemplo — en la app real vienen de session.js + el resultado
    // de la actividad gamificada recién concluida.
    const datosDemo = {
      nombre: 'Nombre de Ejemplo Alumno',
      grado: '2°',
      grupo: 'A',
      pdaNombre: 'Resuelve problemas de proporcionalidad directa',
      eje: 'Sentido numérico y pensamiento algebraico',
      puntaje: 95,
      estrellas: 3,
      estrellasMax: 3,
      codigoVerificacion: (crypto.randomUUID ? crypto.randomUUID() : 'DEMO-0000-0000')
    };

    generarConstancia(document.getElementById('contenedor-constancia'), datosDemo);

    document.getElementById('btn-pdf').addEventListener('click', () => {
      descargarComoPDF('constancia', `constancia-${datosDemo.nombre.replace(/\s+/g, '_')}.pdf`);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MATE-NEM · Matemáticas NEM</title>
<meta name="description" content="Plataforma gamificada de Matemáticas para Secundaria, alineada a la Nueva Escuela Mexicana.">
<meta name="theme-color" content="#4f46e5">

<!-- Favicon: marca "M" en gradiente, como data URI (sin depender de un archivo aparte) -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%23d946ef'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-weight='bold' font-size='34' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">

<!-- Tipografía: Baloo 2 para encabezados (amigable/creativa), Inter para texto -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Tailwind CSS vía CDN: sin build step, funciona directo en GitHub Pages -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Extiende Tailwind con nuestras familias tipográficas (los colores usan
  // la paleta estándar de Tailwind: indigo/violeta, ámbar, esmeralda, rosa).
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ['"Baloo 2"', 'system-ui', 'sans-serif'],
          sans: ['Inter', 'system-ui', 'sans-serif']
        }
      }
    }
  };
</script>

<!-- QR y exportación a PDF para el módulo de constancias -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="font-sans">
  <div id="app" class="min-h-screen"></div>

  <!-- type="module" habilita import/export en app.js y sus dependencias.
       Nota: esto requiere servirse por http(s), no funciona con doble clic
       (file://) por la política CORS de los navegadores para módulos. -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
